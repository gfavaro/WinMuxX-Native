name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Swift toolchain
        run: |
          brew install swiftly
          swiftly init --skip-install --assume-yes --verbose
          swiftly install

      - name: Record tool versions
        run: |
          source ./script/setup.sh
          swift --version
          xcodebuild -version

      - name: Build and test
        run: make check

      - name: Build personal app on main
        if: github.event_name == 'push' && github.repository == 'gfavaro/WinMuxX-Native'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make native-build BUILD_NUMBER="$BUILD_NUMBER"

      - name: Upload personal build
        if: github.event_name == 'push' && github.repository == 'gfavaro/WinMuxX-Native'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WinMuxX-Native-${{ github.run_number }}
          path: .release-native/WinMuxX-Native-*.zip
          if-no-files-found: error
