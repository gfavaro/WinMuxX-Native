# Xcode project configuration. Managed by https://github.com/yonaskolb/XcodeGen
# Xcode is only used to build the release App Bundle. Debug builds only use Swift Package Manager

name: WinMux

packages:
  WinMuxPackage:
    path: .

configs:
  Debug: debug
  Release: release

targets:
  WinMux:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    info:
      path: resources/WinMux-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
    sources:
      - "Sources/WinMuxApp"
      - path: "resources"
        excludes:
          - "marketing"
          - "screenshots"
    dependencies:
      - package: WinMuxPackage
        product: AppBundle
      - package: WinMuxPackage
        product: SparkleSupport
    # https://developer.apple.com/documentation/xcode/build-settings-reference
    settings:
      base:
        SWIFT_VERSION: 6.2 # Swift Language Version
        MARKETING_VERSION: ${XCODEGEN_WINMUX_VERSION}
        CURRENT_PROJECT_VERSION: ${XCODEGEN_WINMUX_BUILD_NUMBER}
        SPARKLE_PUBLIC_KEY: ${XCODEGEN_WINMUX_SPARKLE_PUBLIC_KEY}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ${XCODEGEN_WINMUX_CODE_SIGN_IDENTITY}
        DEVELOPMENT_TEAM: ${XCODEGEN_WINMUX_DEVELOPMENT_TEAM}
      configs:
        Debug:
          PRODUCT_NAME: WinMuxX-Native-Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.gfavaro.winmuxx.native.debug
        Release:
          PRODUCT_NAME: WinMuxX-Native
          PRODUCT_BUNDLE_IDENTIFIER: com.gfavaro.winmuxx.native
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          GCC_TREAT_WARNINGS_AS_ERRORS: YES
    entitlements:
      path: resources/WinMux.entitlements
      properties:
        # Accessibility API doesn't work in sandboxed apps
        com.apple.security.app-sandbox: false
