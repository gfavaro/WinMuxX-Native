config-version = 2

# This is the reference configuration, not your personal config.
# Use the menu's Open Config / Diagnostics actions to locate the loaded file.
# Menu actions display only shortcuts configured for the active mode.
# Diagnostics, manual crash recovery and session-local minimum-size observation
# do not require additional TOML options. Learned minima do not constrain layout yet.

start-at-login = false
after-startup-command = []
# after-login-command is deprecated; use start-at-login and after-startup-command.
auto-reload-config = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
tab-group-padding = 30

# Native tab-group chrome. Height is measured in points.
window-tabs.enabled = true
window-tabs.height = 36

# Built-in, click-through window borders. Do not also start JankyBorders
# in after-startup-command: stop the external borders process to avoid duplicates.
borders.enabled = true
# Width in points; fractional values are supported.
borders.width = 4
# Colors accept #RRGGBB or #RRGGBBAA.
borders.active-color = '#e1e3e4'
borders.inactive-color = '#494d64'
# 'below' draws behind the window; 'above' draws over it.
borders.order = 'below'
# Exclude applications by bundle ID, e.g. ['com.apple.finder'].
borders.exclude-apps = []

# Dwindle splits space recursively when windows are tiled; no layout shortcut is needed.
default-root-container-layout = 'dwindle'
default-root-container-orientation = 'auto'

on-focus-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# Workspace commands target the focused monitor unless --monitor is specified.
# If the target workspace is visible elsewhere, focus follows it to that monitor;
# neither workspace moves. Hidden targets still respect forced monitor assignments.

automatically-unhide-macos-hidden-apps = false
automatically-tile-new-windows = true
# Shake a window horizontally while dragging its title bar to toggle floating/tiling.
enable-shake-to-toggle-tiling = true
# Focus a tiled window after the pointer remains over it for the configured dwell.
focus-follows-mouse = false
focus-follows-mouse-dwell = 250
auto-add-new-windows-to-tab-group = true
shortcuts-preset = 'none'
persistent-workspaces = []
on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    # Space between tiled windows. Set either value to 0 for borderless joins.
    inner.horizontal = 8
    inner.vertical = 8
    # With the sidebar enabled, outer.left is the space between it and tiled windows.
    # Set all outer values to 0 for borderless display edges/sidebar joins.
    outer.left = 12
    outer.bottom = 12
    outer.top = 12
    outer.right = 12

[workspace-sidebar]
    enabled = true
    # Offer a 'Focused' monitor scope in the sidebar's monitor selector.
    enable-focus = false
    # Hide the compact rail until the pointer reaches the selected display edge.
    auto-hide = false
    # Keep the full sidebar open and reserve its width for tiled windows.
    always-expanded = false
    collapsed-width = 50
    width = 280
    # Omit monitor to show an independent sidebar on every display.
    # Legacy monitor = 'main' is also treated as all displays for this sidebar.
    # Use monitor = 1, 'secondary', 2, or a list to restrict it.
    # monitor = [1, 'secondary']
    position = 'left'
    # All height modes protect the menu bar, including its auto-hide reveal area.
    # Centered fits content, growing up to 90% of the safe display height.
    height-mode = 'standard'
    project-deletion-action = 'close-windows'
    show-status-pills = true
    show-clock = false
    show-seconds = true
    show-date = false
    show-weekday = true
    # Liquid Glass uses native menu-bar-inspired glass and adaptive wallpaper contrast.
    # Solid uses the selected opaque color. Also applies to tab groups and switcher.
    # Legacy appearance/background/frosted-tint keys remain accepted but no longer
    # override this style. The Settings UI calls this choice Sidebar appearance.
    # Compact Liquid Glass sidebar only: false shows wallpaper without glass.
    # Expanded Liquid Glass always uses a frosted background.
    # Reduce Transparency overrides this with an opaque system background.
    menu-bar-background = true
    chrome-style = 'liquid-glass'
    # Used when chrome-style = 'solid'. Choose from the Appearance palette, or use 'custom'.
    solid-chrome-color = 'midnight'
    # Used when solid-chrome-color = 'custom'.
    solid-chrome-custom-color = '#191B20'

[workspace-sidebar.project-labels]
    "default" = "Default"

[workspace-sidebar.project-colors]
    "default" = "#C4B5FD"

# Optional display labels; keys are internal workspace names.
# [workspace-sidebar.workspace-labels]
#     "1" = "Terminal"
#     "2" = "Editor"

# Optional fixed monitor assignments. Leave commented for focused-monitor navigation.
# [workspace-to-monitor-force-assignment]
#     "1" = 'main'
#     "2" = 'secondary'

[mode.main.binding]
    ctrl-f = 'open-sidebar'
    alt-space = 'layout horizontal vertical'
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-n = 'focus dfs-next'
    alt-p = 'focus dfs-prev'
    alt-tab = 'focus tab-next'
    alt-shift-tab = 'focus tab-prev'
    alt-0 = 'workspace 10'
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
