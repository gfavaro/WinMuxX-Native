    ctrl-cmd-shift-j = 'stack-with down'
    ctrl-cmd-shift-k = 'stack-with up'
    ctrl-cmd-shift-l = 'stack-with right'
    cmd-shift-i = 'balance-sizes'
    alt-cmd-h = 'project prev'
    alt-cmd-j = 'swap down'
    alt-cmd-k = 'swap up'
    alt-cmd-l = 'project next'
    alt-cmd-1 = 'project 1'
    alt-cmd-2 = 'project 2'
    alt-cmd-3 = 'project 3'
    alt-cmd-4 = 'project 4'
    alt-cmd-5 = 'project 5'
    alt-cmd-6 = 'project 6'
    alt-cmd-7 = 'project 7'
    alt-cmd-8 = 'project 8'
    alt-cmd-9 = 'project 9'
    ctrl-0 = 'workspace 10'
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'
    ctrl-q = 'workspace 11'
    ctrl-w = 'workspace 12'
    ctrl-e = 'workspace 13'
    ctrl-r = 'workspace 14'
    ctrl-t = 'workspace 15'
    ctrl-h = 'workspace prev'
    ctrl-l = 'workspace next'
